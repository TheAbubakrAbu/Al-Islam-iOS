<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Page not found</title>
<meta name="robots" content="noindex">
<script>
// A shared link written as a path (/alislam/quran/2/255) has no file of its own on a static
// host: it is handed to that app's links page, which reads the same pair after a #.
(function () {
  var match = location.pathname.match(/^\/(alislam|alquran|aladhan)\/(.+)$/i);
  if (match && match[2].toLowerCase() !== "index.html") {
    location.replace("/" + match[1].toLowerCase() + "/#" + match[2].replace(/\/+$/, ""));
  }
})();
</script>
<style>
  :root { color-scheme: light dark; }
  body { margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
         font: 17px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif; padding: 24px; text-align: center; }
  a { color: inherit; }
</style>
</head>
<body>
<p>There is nothing at this address. <a href="/">Al-Islam, Al-Quran and Al-Adhan</a></p>
</body>
</html>
